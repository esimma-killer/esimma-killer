# ==============================================================================
# Docker Compose Base — E-SIIMA Killer (E-SIIMA 3)
# Orquestacion reproducible de la API REST con soporte para hot-reload y
# monitoreo de salud (/api/v1/health).
# ==============================================================================

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: esimma-killer-api:0.2.0
    container_name: esimma-killer-api
    ports:
      - "8000:8000"
    environment:
      APP_NAME: "E-SIIMA Killer API (E-SIIMA 3)"
      APP_VERSION: "0.2.0"
      ENVIRONMENT: "development"
      DEBUG: "true"
      API_V1_PREFIX: "/api/v1"
      CORS_ORIGINS: "http://localhost:3000,http://localhost:8080,http://127.0.0.1:8080,*"
    volumes:
      - ./backend/src:/app/src:ro
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - esimma-net

  mongodb:
    image: mongo:7.0
    container_name: esimma-killer-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: "esimma_analytics"
    volumes:
      - ./backend/database/mongodb/init_mongo_schemas.js:/docker-entrypoint-initdb.d/01_init_mongo_schemas.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - esimma-net

  postgres-central:
    image: postgres:17-alpine
    container_name: esimma-killer-postgres-central
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: esimma_central
      POSTGRES_USER: esimma_user
      POSTGRES_PASSWORD: synthetic_pass_only
    volumes:
      - postgres_central_data:/var/lib/postgresql/data
      - ./backend/database/postgresql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./backend/database/postgresql/02_vistas.sql:/docker-entrypoint-initdb.d/02_vistas.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U esimma_user -d esimma_central"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - esimma-net

  postgres-sur:
    image: postgres:17-alpine
    container_name: esimma-killer-postgres-sur
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: esimma_sur
      POSTGRES_USER: esimma_user
      POSTGRES_PASSWORD: synthetic_pass_only
    volumes:
      - postgres_sur_data:/var/lib/postgresql/data
      - ./backend/database/postgresql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./backend/database/postgresql/02_vistas.sql:/docker-entrypoint-initdb.d/02_vistas.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U esimma_user -d esimma_sur"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - esimma-net

networks:
  esimma-net:
    driver: bridge

volumes:
  postgres_central_data:
  postgres_sur_data:
