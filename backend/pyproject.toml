[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "esimma-killer-backend"
version = "0.2.0"
description = "Backend API REST y logica de dominio distribuida para E-SIIMA Killer (E-SIIMA 3) - UAA"
readme = "../README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Francisco Javier Sanchez Vallin" },
    { name = "Gael Emiliano Nefarole Lopez" },
    { name = "Angel Azael Fajardo Espino" },
]
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.32.0,<1.0.0",
    "pydantic>=2.9.0,<3.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "pandas>=2.2.0,<3.0.0",
    "psycopg[binary,pool]>=3.2.0,<4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "pytest-cov>=5.0.0,<7.0.0",
    "httpx>=0.27.2,<1.0.0",
    "ruff>=0.7.0,<1.0.0",
    "bandit>=1.7.10,<2.0.0",
    "pip-audit>=2.7.3,<3.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors (PEP 8)
    "W",   # pycodestyle warnings (PEP 8)
    "F",   # Pyflakes
    "I",   # isort (orden de imports)
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --cov=src --cov-report=term-missing --cov-report=html --cov-fail-under=60"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 60
show_missing = true

[tool.bandit]
exclude_dirs = ["tests", ".venv", "venv"]
