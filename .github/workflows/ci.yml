name: Backend CI Pipeline (PEP 8, Pytest, Bandit & Pip-Audit)

on:
  push:
    branches:
      - main
      - entrega-2
      - entrega-3
      - "feat/**"
      - "fix/**"
      - "docs/**"
      - "test/**"
      - "devops/**"
  pull_request:
    branches:
      - main
      - entrega-2
      - entrega-3

permissions:
  contents: read

jobs:
  lint-pep8:
    name: "PEP 8 Linter & Formatter (Ruff)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Instalar dependencias de desarrollo
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Verificar reglas PEP 8 con Ruff
        run: ruff check .

      - name: Verificar formato consistente con Ruff
        run: ruff format --check .

  unit-tests:
    name: "Unit Tests & Coverage >= 60% (Pytest)"
    runs-on: ubuntu-latest
    needs: lint-pep8
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ejecutar suite Pytest y verificar cobertura >= 60%
        run: pytest --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=60

  security-bandit:
    name: "Static Security Analysis (Bandit)"
    runs-on: ubuntu-latest
    needs: lint-pep8
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Instalar Bandit
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Escanear vulnerabilidades SAST en codigo fuente
        run: bandit -c pyproject.toml -r src/

  security-pip-audit:
    name: "Dependency Vulnerability Audit (Pip-Audit)"
    runs-on: ubuntu-latest
    needs: lint-pep8
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Instalar dependencias de produccion y Pip-Audit
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pip-audit

      - name: Auditar vulnerabilidades conocidas en dependencias (CVE/PYSEC)
        run: pip-audit -r requirements.txt

  docker-build-and-healthcheck:
    name: "Docker Build & Healthcheck (/api/v1/health & /docs)"
    runs-on: ubuntu-latest
    needs:
      - unit-tests
      - security-bandit
      - security-pip-audit
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Compilar imagen con Docker Compose
        run: docker compose build

      - name: Levantar contenedor de la API en segundo plano
        run: docker compose up -d

      - name: Verificar disponibilidad de /api/v1/health y /docs
        run: |
          for i in {1..15}; do
            if curl -fsS http://localhost:8000/api/v1/health && curl -fsS http://localhost:8000/docs > /dev/null; then
              echo "API Docker saludable y /docs disponible!"
              docker compose ps
              docker compose down
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          docker compose down
          exit 1
